name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: shellcheck
        run: |
          files=$(git ls-files 'hooks/session-start' '*.sh')
          if [ -z "$files" ]; then
            echo "no shell scripts to check"
          else
            command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
            shellcheck $files
          fi
